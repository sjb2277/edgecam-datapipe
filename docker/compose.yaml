# 사용: make up PROFILE=core  (값은 ../.env에서 주입, .env.example 참고)
name: edgecam

services:
  redpanda:
    image: ${REDPANDA_IMAGE}
    profiles: [core]
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://${KAFKA_EXTERNAL_HOST}:${KAFKA_EXTERNAL_PORT}
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "${KAFKA_EXTERNAL_PORT}:19092"
      - "${SCHEMA_REGISTRY_EXTERNAL_PORT}:18081"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  console:
    image: ${CONSOLE_IMAGE}
    profiles: [core]
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - "${CONSOLE_PORT}:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/admin/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  postgres:
    image: ${TIMESCALE_IMAGE}
    profiles: [core]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Cold 저장소: S3 API 9000, Master UI 9333, Filer UI 8888 (ADR-0009)
  seaweedfs:
    image: ${SEAWEEDFS_IMAGE}
    profiles: [core]
    command:
      - server
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -master.port=9333
      - -volume.port=8080
      - -filer
      - -filer.port=8888
      - -s3
      - -s3.port=9000
      - -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      - "${S3_PORT}:9000"
      - "${SEAWEEDFS_MASTER_UI_PORT}:9333"
      - "${SEAWEEDFS_FILER_UI_PORT}:8888"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9333/cluster/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  redpanda-data:
  postgres-data:
  seaweedfs-data:
